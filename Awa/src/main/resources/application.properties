spring.application.name=Awa
spring.data.mongodb.uri =${MONGO_STRING}
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.data.mongodb.socket-timeout=10000
spring.data.mongodb.server-selection-timeout=10000
spring.data.mongodb.auto-index-creation=true

# Password reset. Use an HTTPS frontend URL outside local development.
app.password-reset.frontend-url=${PASSWORD_RESET_FRONTEND_URL:http://localhost:3000/reset-password}
app.password-reset.token-ttl=${PASSWORD_RESET_TOKEN_TTL:30m}
app.password-reset.request-cooldown=${PASSWORD_RESET_REQUEST_COOLDOWN:60s}

# Use MAIL_PROVIDER=resend in deployed environments. The default log provider is for local development only.
app.mail.provider=${MAIL_PROVIDER:log}
app.mail.from=${MAIL_FROM:Awa <no-reply@awaroommate.ca>}
app.mail.reply-to=${MAIL_REPLY_TO:}
app.mail.resend-api-key=${RESEND_API_KEY:}
